<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 19px; fill: #f8fafc; }
      .main-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .box-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 11px; letter-spacing: 1px; }
      .card-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 14px; fill: #f8fafc; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
      .prompt-box { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #38bdf8; font-weight: 600; }
      .arrow { stroke: #38bdf8; stroke-width: 2.5; fill: none; }
      .loop-arrow { stroke: #f59e0b; stroke-width: 2; fill: none; stroke-dasharray: 4,4; }
      .green-line { stroke: #34d399; stroke-width: 2; fill: none; }
    </style>

    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <marker id="arr-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#34d399"/></marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="760" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Main Header -->
  <text x="50" y="42" class="main-title">ENTERPRISE RAG &amp; AGENT: SYSTEM ARCHITECTURE</text>
  <text x="50" y="62" class="main-sub">The LangGraph Agent acts as the central conductor managing retrieval, grading, self-correction, and synthesis.</text>

  <!-- ========================================================================= -->
  <!-- 1. FASTAPI GATEWAY -->
  <!-- ========================================================================= -->
  <rect x="50" y="85" width="860" height="85" rx="10" fill="#131c31" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="70" y="108" class="box-tag" fill="#38bdf8">1. APPLICATION GATEWAY (FASTAPI - PORT 8000)</text>
  <text x="70" y="130" class="card-head">Client Prompt Ingress &amp; Validation</text>
  <text x="70" y="150" class="prompt-box">&quot;When is the cloud cluster migration scheduled?&quot;</text>
  
  <rect x="580" y="100" width="310" height="55" rx="6" fill="#0b1220" stroke="#1e3a5f" stroke-width="1"/>
  <text x="595" y="122" class="box-tag" fill="#7dd3fc">Safety &amp; Tracing</text>
  <text x="595" y="142" class="card-desc">UUID X-Request-ID | Pydantic v2 | RFC 7807 (503)</text>

  <!-- Down Arrow from Gateway to Agent -->
  <line x1="480" y1="170" x2="480" y2="198" class="arrow" marker-end="url(#arr-cyan)"/>
  <text x="490" y="188" class="card-desc" fill="#38bdf8" font-size="11">Hands prompt to Agent State</text>

  <!-- ========================================================================= -->
  <!-- 2. THE LANGGRAPH AGENT (THE CENTRAL BRAIN) -->
  <!-- ========================================================================= -->
  <rect x="50" y="205" width="860" height="400" rx="12" fill="#151226" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="70" y="232" class="box-tag" fill="#c084fc">2. THE LANGGRAPH AGENT (THE CONDUCTOR / THE BRAIN)</text>

  <!-- Node 1: retrieve_node -->
  <rect x="250" y="255" width="240" height="55" rx="8" fill="#1e1838" stroke="#818cf8" stroke-width="1.5"/>
  <text x="265" y="278" class="card-head">Node 1: retrieve</text>
  <text x="265" y="296" class="card-desc">Dispatches query to Qdrant storage</text>

  <!-- External Qdrant Box (Pantry) -->
  <rect x="590" y="245" width="300" height="80" rx="8" fill="#081e17" stroke="#10b981" stroke-width="1.5"/>
  <text x="605" y="268" class="card-head" fill="#6ee7b7">QDRANT VECTOR DB (DOCKER)</text>
  <text x="605" y="288" class="card-desc">&#8226; Dense HNSW (384-d) + Sparse BM25</text>
  <text x="605" y="306" class="card-desc">&#8226; Fuses with RRF &#8594; Cross-Encoder Reranker</text>

  <!-- Connectors between retrieve and Qdrant -->
  <line x1="490" y1="275" x2="578" y2="275" class="green-line" marker-end="url(#arr-green)"/>
  <line x1="590" y1="295" x2="498" y2="295" class="green-line" marker-end="url(#arr-green)"/>

  <!-- Node 2: grade_documents -->
  <rect x="250" y="345" width="240" height="55" rx="8" fill="#1e1838" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="265" y="368" class="card-head">Node 2: grade_context</text>
  <text x="265" y="386" class="card-desc">Evaluates confidence score &gt;= -4.0</text>

  <line x1="370" y1="310" x2="370" y2="337" class="arrow" marker-end="url(#arr-cyan)"/>

  <!-- Decision Diamond -->
  <polygon points="370,425 440,455 370,485 300,455" fill="#1e1838" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="330" y="452" class="card-head" fill="#fde68a" font-size="12">Is Context</text>
  <text x="338" y="466" class="card-head" fill="#fde68a" font-size="12">Good?</text>

  <line x1="370" y1="400" x2="370" y2="418" class="arrow" marker-end="url(#arr-cyan)"/>

  <!-- Node 3: rewrite_query (Self-Correction Loop) -->
  <rect x="80" y="345" width="140" height="55" rx="8" fill="#291a08" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="90" y="368" class="card-head" fill="#fde68a" font-size="12">Node 3: rewrite</text>
  <text x="90" y="386" class="card-desc">Self-Correction (max 2)</text>

  <!-- Loop routing: Diamond -> Rewrite -> Retrieve -->
  <path d="M 300 455 L 150 455 L 150 408" class="loop-arrow" marker-end="url(#arr-amber)"/>
  <text x="160" y="445" class="card-desc" fill="#f59e0b" font-size="11">NO (Context Poor)</text>

  <path d="M 150 345 L 150 282 L 242 282" class="loop-arrow" marker-end="url(#arr-amber)"/>
  <text x="160" y="275" class="card-desc" fill="#f59e0b" font-size="11">Re-search</text>

  <!-- Node 4: generate_node -->
  <rect x="250" y="525" width="240" height="55" rx="8" fill="#09261a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="265" y="548" class="card-head" fill="#86efac">Node 4: generate</text>
  <text x="265" y="566" class="card-desc">Grounded Synthesis &amp; Fallback</text>

  <line x1="370" y1="485" x2="370" y2="517" class="arrow" marker-end="url(#arr-cyan)"/>
  <text x="380" y="505" class="card-desc" fill="#4ade80" font-size="11">YES (Context Relevant)</text>

  <!-- Agent State Footer -->
  <text x="590" y="365" class="box-tag" fill="#a78bfa">AGENT STATE (RAM)</text>
  <text x="590" y="385" class="card-desc">&#8226; query &amp; rewritten_query (str)</text>
  <text x="590" y="405" class="card-desc">&#8226; documents: list[SearchResult]</text>
  <text x="590" y="425" class="card-desc">&#8226; retry_count: int (bounded loop)</text>
  <text x="590" y="445" class="card-desc">&#8226; context_quality: relevant / poor</text>

  <!-- Down Arrow from Agent to Stream -->
  <line x1="370" y1="580" x2="370" y2="628" class="arrow" marker-end="url(#arr-cyan)"/>

  <!-- ========================================================================= -->
  <!-- 3. FINAL OUTPUT -->
  <!-- ========================================================================= -->
  <rect x="50" y="635" width="860" height="85" rx="10" fill="#131c31" stroke="#22c55e" stroke-width="1.5"/>
  <text x="70" y="658" class="box-tag" fill="#4ade80">3. FINAL STREAMED RESPONSE (OUTPUT VIA SSE)</text>
  <text x="70" y="680" class="prompt-box" fill="#86efac">&quot;The multi-region cluster migration is scheduled for Q4.&quot; [Source: cloud_spend.md]</text>
  <text x="70" y="700" class="card-desc">Streamed token-by-token with verified citations and latency timer (X-Process-Time: 0.185s)</text>
</svg>